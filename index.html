<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d2818" />
  <meta name="description" content="Planifier les cultures en Guyane — simple, sur le téléphone" />
  <title>Guyane Cultures</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-brand">
        <span class="logo" aria-hidden="true">🌿</span>
        <div>

    <main id="content" class="content"></main>

    <nav class="bottom-nav" aria-label="Navigation">
      <button type="button" data-tab="accueil" class="nav-item active">
        <span class="nav-icon">🏠</span><span class="nav-label">Accueil</span>
      </button>
      <button type="button" data-tab="cultures" class="nav-item">
        <span class="nav-icon">🌱</span><span class="nav-label">Cultures</span>
      </button>
      <button type="button" data-tab="planning" class="nav-item">
        <span class="nav-icon">📅</span><span class="nav-label">Planning</span>
      </button>
      <button type="button" data-tab="plus" class="nav-item">
        <span class="nav-icon">⋯</span><span class="nav-label">Plus</span>
      </button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>

</html>
